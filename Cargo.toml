[package]
name = "plugin-cli"
version = "0.1.0"
edition = "2021"
exclude = ["index.js"]

[[bin]]
name = "plugin-cli"
path = "src/main.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
clap = { version = "4.5.1", features = ["derive"] }
flate2 = "1.0.28"
glob = "0.3.1"
home = "0.5.9"
ignore = "0.4.22"
inquire = "0.7.0"
keyring = { version = "2.3.2", default-features = false, features = [
    "byteorder",
    "linux-keyutils",
    "linux-secret-service",
    "linux-secret-service-rt-tokio-crypto-rust",
    "platform-all",
    "platform-linux",
    "platform-macos",
    "platform-windows",
    "security-framework",
    "windows-sys",
] }
liquid = "0.26.4"
owo-colors = "4.0.0"
reqwest = { version = "0.11.26", features = ["blocking", "multipart", "json"] }
semver = { version = "1.0.22", features = ["serde"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tar = "0.4.40"
thiserror = "1.0.57"
